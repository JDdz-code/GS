<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <title>SpawnCamp</title>
    <meta name="Autor" content="Jeuri de León">
    <meta name="descripcion" content="Catálogo de videojuegos retro">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="./Css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet" type="text/css">
    <script src="./Js/contacto.js" defer></script>
    <script src="./Js/tema.js" defer></script>

  </head>

  <body>
  <header>
        <nav>
            <a id="logo" href="index.html"><img src="./Imagenes/spawn_camp_logo_transparente.png" alt="logo SpawnCamp"
                    width="80px"></a>
            <ul>
                <li><a href="./index.html">Inicio</a></li>
                <li><a href="index.html#Catalogo">Catálogo</a></li>
                <li><a href="ficha.html">Ficha</a></li>
                <li><a href="contact_form.html">Contacto</a></li>
                <li><button id="dark_mode" type="button">Modo claro</button></li>    </ul>
        </nav>
    </header>

    <main>
      <section id="contact_form">
        <form method="post" novalidate>
          <h1>Contacto</h1>

          <fieldset>
            <legend>Escríbenos</legend>

            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>

            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required>

            <label for="numero">Número de teléfono</label>
            <input type="tel" id="numero" name="numero" placeholder="678-901-234" required>

            <label for="mensaje">Mensaje</label>
            <textarea id="mensaje" name="mensaje" rows="5" placeholder="Cuéntanos qué necesitas" required></textarea>

            <input type="submit" value="Enviar">
          </fieldset>
        </form>
      </section>
    </main>
    
  </body>
</html>
